<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실버 도구 레크레이션 계획서</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent;}
:root{--green:#1A7A50;--green-d:#12603E;--green-bg:#EAF5EF;--ink:#20241F;--sub:#6B6E67;--line:#E3E1D8;--bg:#EEECE6;}
body{background:var(--bg);color:var(--ink);}
/* 프로그램 선택 화면 */
#selectScreen{max-width:820px;margin:0 auto;padding:40px 20px 60px;}
.sel-hd{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
.sel-hd .leaf{width:32px;height:32px;background:#DDEFCB;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;}
.sel-hd h2{font-size:22px;font-weight:900;}
.sel-sub{font-size:13px;color:var(--sub);margin:0 0 22px 42px;}
.progs{display:flex;flex-direction:column;gap:10px;max-width:460px;}
.pcard{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:18px 20px;font-size:16px;font-weight:800;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:space-between;}
.pcard.ready:hover{border-color:var(--green);background:#F6FBF8;transform:translateX(3px);}
.pcard.soon{opacity:.6;cursor:default;}
.pcard .tag{font-size:11px;font-weight:700;color:#8A8778;background:#F1EFE9;border:1px solid #DDD9CE;border-radius:20px;padding:2px 9px;}
.backbtn{height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;padding:0 12px;margin-right:2px;}
.bar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;position:sticky;top:0;z-index:20;}
.bar .leaf{width:28px;height:28px;background:#DDEFCB;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
.bar h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin-right:6px;}
.fld{display:flex;flex-direction:column;gap:5px;}
.fld label{font-size:11px;font-weight:700;color:var(--sub);}
.fld input,.fld select{height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;font-size:13.5px;font-weight:600;outline:none;}
.fld input{min-width:120px;} .fld select{min-width:130px;cursor:pointer;max-width:190px;}
.fld input:focus,.fld select:focus{border-color:var(--green);}
.fld.sub{position:relative;}
.tabs{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap;}
.tab{height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;padding:0 14px;}
.tab.on{background:var(--green);border-color:var(--green);color:#fff;}
.btn{height:38px;border:1px solid #2b5c46;background:#2b5c46;color:#fff;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;padding:0 14px;}
.btn2{height:38px;border:1.5px solid var(--green);background:#fff;color:var(--green-d);border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;padding:0 12px;}
.btn2:hover{background:#F6FBF8;}
.btn2.ghost{border-color:var(--line);color:var(--sub);}
.btn2.ghost:hover{background:#f4f4f0;}

.stage{display:flex;justify-content:center;padding:22px 12px 60px;overflow-x:hidden;}
#planWrap,#journalWrap{display:contents;}
.page{background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.13);margin-bottom:20px;flex-shrink:0;}
.page.portrait{width:210mm;min-height:297mm;}
.page.land{width:297mm;min-height:210mm;}
.sec{display:none;}
.sec.on{display:block;}
/* 월간계획서: 순환 캐러셀 (좌우 스와이프·화살표, 가운데만 선명) */
@media screen{
  .stage.mcar{display:block;position:relative;z-index:1;overflow:hidden;justify-content:unset;padding:22px 0 30px;touch-action:pan-y;user-select:none;}
  .stage.mcar .sec-monthly{display:block!important;position:absolute;top:22px;left:50%;transform-origin:top center;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease,filter .4s ease;margin:0;box-shadow:0 10px 34px rgba(0,0,0,.16);cursor:default;}
  #mcNav{display:none;}
  .stage.mcar ~ #mcNav,#planScreen.mcaron #mcNav{display:flex;}
  #mcNav{position:fixed;left:0;right:0;bottom:26px;justify-content:center;gap:18px;z-index:200;pointer-events:none;}
  #mcNav button{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:22px;color:var(--green-d);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  #mcNav button:hover{background:#F6FBF8;border-color:var(--green);}
  #mcNav .pos{pointer-events:none;align-self:center;background:rgba(31,40,31,.82);color:#fff;font-size:12.5px;font-weight:800;padding:7px 14px;border-radius:20px;min-width:74px;text-align:center;}
}

/* ── 소개서 ── */
/* 공식 문서 레터헤드 (소개서·계획표 공통) */
.lh{display:flex;align-items:center;gap:12px;}
.lh-logo{width:42px;height:48px;flex-shrink:0;}
.lh-logo img{width:100%;height:100%;object-fit:contain;display:block;}
.lh-wm .k{font-size:10.5px;color:#9a9788;font-weight:600;letter-spacing:1px;}
.lh-wm .n{font-size:14.5px;font-weight:800;color:#2b6b48;letter-spacing:.4px;}
.lh-rt{margin-left:auto;text-align:right;font-size:11.5px;color:#8a8a80;font-weight:700;line-height:1.55;}
.lh-mgr{font-size:10px;color:#9a978c;font-weight:700;margin-top:3px;}
.lh-rule{height:2.5px;background:var(--green);border-radius:2px;margin:9px 0 0;}
.lh-rule.thin{height:1px;background:var(--line);margin-top:2px;}
/* 소개서 */
.ipad{padding:13mm 15mm;}
.ititle{text-align:center;font-size:25px;font-weight:900;letter-spacing:1.5px;margin-top:16px;color:#1f281f;}
.isubtitle{text-align:center;font-size:12.5px;color:var(--sub);margin:5px 0 15px;}
.ilead{font-size:12.8px;line-height:1.8;color:#374035;background:var(--green-bg);border:1px solid #d6e9de;border-left:4px solid var(--green);border-radius:8px;padding:13px 16px;margin-bottom:20px;}
.ibody{padding:0;}
.isec{margin-bottom:20px;}
.isec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:var(--green-d);margin-bottom:11px;}
.isec-h .bi{width:5px;height:17px;background:var(--green);border-radius:3px;}
.info{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.info .row{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.info .row.full{grid-column:1 / -1;}
.info .row.col2{flex-direction:column;}
.info .row.col2 .cell{display:flex;}
.info .row.col2 .cell + .cell{border-top:1px solid var(--line);}
.info .k{background:var(--green-bg);color:var(--green-d);font-weight:700;font-size:13px;padding:11px 14px;width:96px;flex-shrink:0;display:flex;align-items:center;}
.info .v{padding:11px 14px;font-size:13.5px;display:flex;align-items:center;line-height:1.55;}
.info .v.host{font-weight:800;}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.feat .f{display:flex;gap:9px;align-items:flex-start;background:#FAFBF8;border:1px solid var(--line);border-radius:10px;padding:11px 13px;}
.feat .f .ic{color:var(--green);font-weight:900;font-size:14px;flex-shrink:0;}
.feat .f .t{font-size:12.8px;line-height:1.55;color:#33372f;}
.steps{display:flex;flex-direction:column;gap:8px;}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 13px;border:1px solid var(--line);border-radius:10px;}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step .tt{font-size:13.5px;font-weight:700;} .step .dd{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.5;}
.eff{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.eff .e{border:1px solid var(--line);border-radius:12px;padding:13px 14px;}
.eff .e .top{display:flex;align-items:center;gap:8px;margin-bottom:5px;} .eff .e .em{font-size:19px;} .eff .e .lb{font-size:13.5px;font-weight:800;}
.eff .e.c1{background:#EFF7F2;border-color:#CDE7DA;} .eff .e.c1 .lb{color:#12603E;}
.eff .e.c2{background:#EEF3FC;border-color:#CFDDF4;} .eff .e.c2 .lb{color:#1E50C0;}
.eff .e.c3{background:#FCF1EC;border-color:#F2D6C7;} .eff .e.c3 .lb{color:#B4530E;}
.eff .e.c4{background:#F5F0FA;border-color:#E0D3EF;} .eff .e.c4 .lb{color:#6A2BC9;}
.eff .e .tx{font-size:12.3px;line-height:1.55;color:#3a3e36;}
.ifoot{border-top:1px solid var(--line);margin:10px 0 0;padding:12px 0 2px;text-align:center;font-size:11.5px;color:#9A968C;}
.ifoot b{color:var(--green);}
.icontact{margin-top:14px;background:#F6F9F6;border:1px solid #dbe6de;border-radius:9px;padding:10px 14px;font-size:12px;color:#41493d;text-align:center;}
.icontact b{color:var(--green-d);font-weight:800;}

/* ── 표 공통 (연간/월간) ── */
.doc-pad{padding:14mm 12mm;}
.doc-title{text-align:center;font-size:21px;font-weight:900;margin-bottom:4px;}
.doc-sub{text-align:center;font-size:12px;color:var(--sub);margin-bottom:14px;}
table{width:100%;border-collapse:collapse;}
th,td{border:1px solid #C9C6BC;padding:7px 8px;font-size:11.5px;vertical-align:top;text-align:left;}
th{background:#EEF4EF;color:#2b5c46;font-weight:800;text-align:center;white-space:nowrap;}
td.c{text-align:center;} .wk{text-align:center;font-weight:800;color:var(--green);white-space:nowrap;}
.mn{font-weight:700;text-align:center;white-space:nowrap;}
.dt{text-align:center;font-weight:700;white-space:nowrap;}
.sec-annual th,.sec-annual td{text-align:center!important;vertical-align:middle!important;font-size:11px;}
.sec-annual td.desc{word-break:keep-all;overflow-wrap:break-word;line-height:1.45;}
.sec-annual td.prep{word-break:keep-all;overflow-wrap:break-word;line-height:1.4;}
.sec-annual td.prep .cl2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.sec-annual td.dt{white-space:nowrap;}
.mon-h{font-size:16px;font-weight:800;color:var(--green-d);margin:16px 0 8px;display:flex;align-items:center;gap:8px;}
.mon-h .bi{width:5px;height:16px;background:var(--green);border-radius:3px;}
.mon-h:first-child{margin-top:0;}
/* 월간계획서 — A4 한 장 꽉 채우는 카드형 */
.sec-monthly{height:297mm;min-height:0;overflow:hidden;}
.mon-inner{height:100%;display:flex;flex-direction:column;padding:13mm 14mm;overflow:hidden;}
.mon-title{font-size:20px;font-weight:900;color:#1f281f;margin-top:12px;letter-spacing:.5px;}
.mon-title span{font-size:14px;font-weight:700;color:var(--sub);}
.mon-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 9px;}
.mon-meta .mm{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px;}
.mon-meta .mm.full{grid-column:1/-1;}
.mon-meta .mm-k{background:var(--green-bg);color:var(--green-d);font-weight:800;padding:6px 12px;width:92px;flex-shrink:0;display:flex;align-items:center;white-space:nowrap;}
.mon-meta .mm-v{padding:6px 12px;display:flex;align-items:center;font-weight:600;}
.mon-meta .mm-v.chips{flex-wrap:wrap;gap:5px;padding:7px 10px;}
.mchip{background:#EEF4EF;border:1px solid #d3e3d8;color:#2b6b48;border-radius:20px;padding:2px 10px;font-size:11.5px;font-weight:700;}
.sec{word-break:keep-all;}
.mon-weeks{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;margin-bottom:9px;}
.wk-card{flex:1;display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:9px 13px;background:#fff;min-height:0;overflow:hidden;}
.wk-card:nth-child(even){background:#FAFCFA;}
.wk-l{width:100px;flex-shrink:0;border-right:1px dashed #d8ddd6;padding-right:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:3px;}
.wk-date{font-size:14px;font-weight:900;color:var(--green-d);}
.wk-dow{font-size:11.5px;color:var(--sub);font-weight:700;}
.wk-no{font-size:11px;color:#fff;background:var(--green);border-radius:6px;padding:2px 10px;margin-top:3px;font-weight:700;}
.wk-r{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:5px;min-width:0;overflow:hidden;padding:2px 0;}
.wk-cat{display:inline-block;font-size:9.5px;font-weight:800;border-radius:5px;padding:1.5px 8px;margin-right:8px;letter-spacing:.2px;flex-shrink:0;min-width:52px;text-align:center;}
.wk-cat.main{background:var(--green);color:#fff;}
.wk-cat.sub{background:#EEF4EF;color:#3c6b52;border:1px solid #d3e3d8;}
.wk-cat.goal{background:#1E50C0;color:#fff;}
.wk-act{font-size:12.3px;line-height:1.5;color:#333b30;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.wk-act b{font-weight:800;color:#20261f;}
.wk-act,.wk-prep{flex-shrink:0;}
/* 5주차 달: 폰트·여백만 살짝 줄여 A4 한 장에 맞추되, 설명·목표는 유지 */
.mon-weeks.wk5 .wk-card{padding:6px 12px;}
.mon-weeks.wk5 .wk-r{gap:2px;justify-content:space-evenly;padding:1px 0;}
.mon-weeks.wk5 .wk-act{font-size:11.4px;line-height:1.36;-webkit-line-clamp:1;}
.mon-weeks.wk5 .wk-goal{font-size:11px;line-height:1.34;padding:4px 9px;-webkit-line-clamp:2;max-height:none;}
.mon-weeks.wk5 .wk-prep{font-size:10px;padding-top:3px;}
.mon-weeks.wk5 + .mon-note{padding:6px 10px;font-size:10px;}
.wk-sd{color:#98a08f;font-size:11px;}
.wk-goal{font-size:12px;line-height:1.5;color:#245c43;background:#F1F8F3;border:1px solid #d8ebe0;border-radius:8px;padding:6px 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex-shrink:0;}
.wk-goal .wk-cat{vertical-align:1px;}
.wk-prep{font-size:11px;line-height:1.4;color:#8f958a;border-top:1px dashed #e0e4dd;padding-top:6px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
.wk-prep b{color:#6b7268;}
.mon-note{border:1px dashed #c9d3cc;background:#F6F9F6;border-radius:10px;padding:8px 12px;font-size:11px;line-height:1.5;color:#4a5145;}
.mon-note b{color:var(--green-d);}
.mon-foot{text-align:center;font-size:10.5px;color:#a8a598;margin-top:9px;}

/* ── 프로그램 일지 ── */
.sec-journal .jpad{display:flex;flex-direction:column;padding:12mm 15mm;min-height:297mm;}
.sec-journal .jhead{display:flex;align-items:center;gap:14px;margin-bottom:4px;}
.sec-journal .jhead .logo{width:44px;height:48px;flex-shrink:0;}
.sec-journal .jhead .logo svg{width:100%;height:100%;}
.sec-journal .jhead .wm .k{font-size:11.5px;color:#9a9788;font-weight:600;letter-spacing:1px;}
.sec-journal .jhead .wm .n{font-size:15px;font-weight:800;color:#2b6b48;letter-spacing:.5px;}
.sec-journal .jhead .rt{margin-left:auto;text-align:right;font-size:12px;color:#9a9788;font-weight:700;letter-spacing:.5px;}
.sec-journal .jtitle{text-align:center;font-size:23px;font-weight:900;letter-spacing:8px;color:#1e1e1c;margin:6px 0 3px;padding-left:8px;}
.sec-journal .jrule{height:3px;background:var(--green);border-radius:2px;margin-bottom:10px;}
table.j{width:100%;border-collapse:collapse;table-layout:fixed;}
table.j td{border:1px solid #6C6A60;padding:9px 12px;font-size:12.7px;vertical-align:middle;line-height:1.55;text-align:left;}
.sec-journal .tl{background:var(--green-bg);font-weight:700;text-align:center;color:var(--green-d);white-space:nowrap;letter-spacing:.2px;font-size:12px;padding-left:6px;padding-right:6px;}
.sec-journal .sech{background:#28684A;color:#fff;font-weight:800;text-align:center;letter-spacing:3px;font-size:12.5px;padding:5px;}
.sec-journal .jin{width:100%;border:0;border-bottom:1px dashed #bdbaae;background:transparent;font-size:12.8px;font-weight:600;font-family:inherit;outline:none;padding:2px;color:#20241f;}
.sec-journal .jin:focus{border-bottom-color:var(--green);background:#F6FBF8;}
.sec-journal .prep2{font-size:12.6px;line-height:1.85;}
.sec-journal td.ta{vertical-align:top;padding:9px 12px;}
.sec-journal .proc{font-size:12.3px;line-height:1.9;white-space:pre-wrap;}
.sec-journal .proc .hd2{font-weight:800;color:var(--green-d);}
.sec-journal textarea{width:100%;border:1px solid #E1E5DF;border-radius:7px;background:#FBFDFB;padding:9px 10px;font-size:12.3px;font-family:inherit;line-height:1.75;outline:none;resize:none;min-height:80px;display:block;}
.sec-journal textarea:focus{border-color:var(--green);background:#F6FBF8;}
.sec-journal .photos{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sec-journal .photo{border:1.4px dashed #C3C0B6;border-radius:10px;height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#B4B1A6;font-size:12px;gap:6px;background:#FBFAF6;}
.sec-journal .photo .ic{font-size:24px;}
.sec-journal .jfoot{text-align:center;font-size:11px;color:#a8a598;margin-top:auto;padding-top:12px;letter-spacing:.5px;}
.sec-journal .jfoot b{color:var(--green);}

@media print{
  #selectScreen{display:none!important;}
  .bar{display:none!important;} body{background:#fff;}
  #planScreen{display:block!important;}
  .stage{padding:0;display:block;margin:0;overflow:visible;}
  #planWrap,#journalWrap{display:block;}
  .page{box-shadow:none;margin:0;width:auto!important;min-height:0!important;}
  .sec{display:block!important;}
  /* 인쇄 범위: 계획서(전체) / 일지만 / 개별 문서 */
  body.pr-plan .sec-journal{display:none!important;}
  body.pr-journal .sec-intro,body.pr-journal .sec-annual,body.pr-journal .sec-monthly{display:none!important;}
  body.pr-plan .sec-intro+.sec,body.pr-plan .sec-annual+.sec{page-break-before:always;}
  body.pr-intro .sec:not(.sec-intro){display:none!important;}
  body.pr-annual .sec:not(.sec-annual){display:none!important;}
  body.pr-monthly .sec:not(.sec-monthly){display:none!important;}
  @page{size:A4 portrait;margin:12mm;}
  @page land{size:A4 landscape;margin:8mm;}
  .sec-annual{page:land;}
  .sec-monthly{height:271mm!important;overflow:hidden;}
  .sec-monthly .mon-inner{padding:0 3mm;}
  .sec-monthly+.sec-monthly{break-before:page;page-break-before:always;}
  tr,.isec,.step,.feat .f,.eff .e,.info .row,.photos{break-inside:avoid;page-break-inside:avoid;}
  thead{display:table-header-group;}
  .wk-card{break-inside:avoid;page-break-inside:avoid;}
  /* 소개서 A4 한 장에 */
  .sec-intro .ipad{padding:0;}
  .sec-intro .lh-logo{width:38px;height:44px;}
  .sec-intro .lh-rule{margin-top:6px;}
  .sec-intro .ititle{font-size:20px;margin-top:6px;letter-spacing:1px;}
  .sec-intro .isubtitle{margin:3px 0 7px;}
  .sec-intro .ilead{font-size:11.2px;line-height:1.5;padding:8px 12px;margin-bottom:8px;}
  .sec-intro .ibody{padding:0;}
  .sec-intro .isec{margin-bottom:6px;}
  .sec-intro .isec-h{font-size:13px;margin-bottom:5px;}
  .sec-intro .info{gap:5px;} .sec-intro .info .k,.sec-intro .info .v{padding:6px 12px;font-size:12px;}
  .sec-intro .feat{gap:5px;} .sec-intro .feat .f{padding:6px 11px;} .sec-intro .feat .f .t{font-size:11.3px;line-height:1.4;}

.wz-row>label{display:block;font-size:12.5px;font-weight:800;color:var(--green-d);margin-bottom:6px;}
.wz-row input,.wz-row select{width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:14px;font-weight:600;outline:none;font-family:inherit;background:#fff;}

.wz-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.evs{display:flex;flex-direction:column;gap:8px;}
.ev{border:1.5px solid var(--line);border-radius:11px;padding:11px 13px 11px 40px;font-size:12.6px;line-height:1.5;color:#41493d;cursor:pointer;position:relative;transition:.12s;}
.ev:before{content:'';position:absolute;left:14px;top:12px;width:16px;height:16px;border:2px solid #C4C9BE;border-radius:50%;box-sizing:border-box;}
.ev:hover{border-color:#9FCBB4;background:#F7FBF8;}
.ev.sel{border-color:var(--green);background:#EFF7F2;color:#20241f;}
.ev.sel:before{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px #fff;}
.ev .n{font-weight:800;color:var(--green);margin-right:4px;}
.ev-ta{width:100%;margin-top:8px;border:1.5px solid var(--green);border-radius:11px;padding:10px 12px;font-size:12.8px;font-family:inherit;line-height:1.6;outline:none;resize:vertical;min-height:70px;background:#F6FBF8;}
.wz-ft{position:sticky;bottom:0;background:#fff;padding:12px 22px 18px;border-top:1px solid var(--line);}
.wz-go{width:100%;height:48px;border:0;background:var(--green);color:#fff;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;}
.wz-go:hover{background:var(--green-d);}
/* ── 스캔 완성 애니메이션 ── */
.wz{position:relative;}
.wz.scanning{overflow:hidden;}
.scan-done{position:absolute;inset:0;border-radius:18px;background:linear-gradient(160deg,#ffffff,#f3f8f4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:6;opacity:0;pointer-events:none;clip-path:inset(0 0 100% 0);}
.scan-done .chk{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 12px 26px rgba(26,122,80,.34);transform:scale(.6);}
.scan-done .t{font-size:19px;font-weight:900;color:var(--green-d);}

.scan-bar{position:absolute;left:-4%;width:108%;height:26px;top:-26px;z-index:7;opacity:0;pointer-events:none;background:linear-gradient(180deg,rgba(46,145,102,0),rgba(46,145,102,.35) 44%,#8CE0B4 50%,rgba(46,145,102,.35) 56%,rgba(46,145,102,0));box-shadow:0 0 26px 6px rgba(70,190,130,.5);}
.wz.scanning .scan-done{animation:scanReveal 1.15s ease .08s forwards;opacity:1;}
.wz.scanning .scan-done .chk{animation:chkPop .4s cubic-bezier(.3,1.5,.5,1) 1s forwards;}

.ld-filters{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px;}

.menu-btn{display:flex;align-items:center;gap:13px;width:100%;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:16px 16px;margin-bottom:12px;cursor:pointer;text-align:left;transition:.13s;font-family:inherit;}

// 페이지 요소를 화면 그대로 이미지로 렌더 (레이아웃·글꼴 유지)
function nodeToPNG(el){
  return new Promise((resolve,reject)=>{
    const w=el.offsetWidth, h=el.offsetHeight;
    const css=document.querySelector('style').innerHTML;
    const clone=el.cloneNode(true);
    clone.style.transform='none'; clone.style.filter='none'; clone.style.opacity='1'; clone.style.zoom=''; clone.style.position='static'; clone.style.margin='0'; clone.classList.remove('focus');
    const xhtml=new XMLSerializer().serializeToString(clone);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>'+css+' .sec{display:block!important}</style>'+xhtml+'</div></foreignObject></svg>';
    const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    const img=new Image();
    img.onload=()=>{ try{ const s=2,c=document.createElement('canvas'); c.width=w*s;c.height=h*s; const ctx=c.getContext('2d'); ctx.scale(s,s); ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0); resolve({data:c.toDataURL('image/png'),w,h,canvas:c}); }catch(e){reject(e);} };
    img.onerror=()=>reject(new Error('이미지 렌더 실패'));
    img.src=url;
  });
}

// ── PDF·WORD 바이트 생성 (자격증 발급기와 동일 방식) ──
function _b64ToU8(b64){ const bin=atob(b64); const u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i); return u8; }
function _u8ToB64(u8){ let bin=''; const chunk=0x8000; for(let i=0;i<u8.length;i+=chunk){ bin+=String.fromCharCode.apply(null,u8.subarray(i,i+chunk)); } return btoa(bin); }
function _jpegSize(d){ for(let i=2;i<d.length;){ if(d[i]!==0xFF){ i++; continue; } const m=d[i+1]; if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC){ return [(d[i+7]<<8)|d[i+8],(d[i+5]<<8)|d[i+6]]; } i+=2+((d[i+2]<<8)|d[i+3]); } return [0,0]; }
function _jpegToPdf(jpeg,iw,ih){
  const A4W=595.28,A4H=841.89; const s=Math.min(A4W/iw,A4H/ih),w=iw*s,h=ih*s,x=(A4W-w)/2,y=(A4H-h)/2;
  const enc=str=>new TextEncoder().encode(str); const parts=[]; let len=0; const push=u=>{parts.push(u);len+=u.length;}; const off=[];
  push(enc("%PDF-1.3\n%\xFF\xFF\xFF\xFF\n"));
  function obj(n,head,stream){ off[n]=len; push(enc(n+" 0 obj\n"+head)); if(stream){ push(enc("\nstream\n")); push(stream); push(enc("\nendstream")); } push(enc("\nendobj\n")); }
  obj(1,"<</Type/Catalog/Pages 2 0 R>>");
  obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
  obj(3,"<</Type/Page/Parent 2 0 R/MediaBox[0 0 "+A4W.toFixed(2)+" "+A4H.toFixed(2)+"]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>");
  obj(4,"<</Type/XObject/Subtype/Image/Width "+iw+"/Height "+ih+"/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length "+jpeg.length+">>",jpeg);
  const content=enc("q "+w.toFixed(2)+" 0 0 "+h.toFixed(2)+" "+x.toFixed(2)+" "+y.toFixed(2)+" cm /Im0 Do Q");
  obj(5,"<</Length "+content.length+">>",content);
  const xrefOff=len; let xref="xref\n0 6\n0000000000 65535 f \n"; for(let i=1;i<=5;i++) xref+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  push(enc(xref)); push(enc("trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n"+xrefOff+"\n%%EOF"));
  const out=new Uint8Array(len); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out;
}
// 프로그램 일지 → 편집 가능한 Word(HTML) : 입력칸 값을 실제 텍스트로 치환
function _journalDocHtml(){
  const el=document.querySelector('.sec-journal'); if(!el) return '';
  const clone=el.cloneNode(true);
  clone.querySelectorAll('input').forEach(inp=>{ const sp=document.createElement('span'); sp.textContent=inp.value||''; inp.replaceWith(sp); });
  clone.querySelectorAll('textarea').forEach(tx=>{ const div=document.createElement('div'); div.style.whiteSpace='pre-wrap'; div.textContent=tx.value||''; tx.replaceWith(div); });
  const css=document.querySelector('style').innerHTML;
  return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page{size:A4;margin:12mm} body{font-family:"맑은 고딕","Malgun Gothic",sans-serif;} '+css+' .sec{display:block!important} input,textarea{display:none}</style></head><body>'+clone.outerHTML+'</body></html>';
}
async function _buildJournalFiles(){
  fillA4();
  if(document.fonts&&document.fonts.ready){ try{await document.fonts.ready;}catch(e){} }
  const el=document.querySelector('.sec-journal');
  const {canvas}=await nodeToPNG(el);
  const jpg=_b64ToU8(canvas.toDataURL('image/jpeg',0.92).split(',')[1]);
  let [iw,ih]=_jpegSize(jpg); if(!iw||!ih){ iw=canvas.width; ih=canvas.height; }
  const pdf=_jpegToPdf(jpg,iw,ih);
  const docHtml=_journalDocHtml();
  return { pdf:_u8ToB64(pdf), doc:_u8ToB64(new TextEncoder().encode('﻿'+docHtml)) };
}
async function saveJournalRecord(){
  const rec=collectJournal();
  if(!rec.center){ alert('센터명(장소)을 먼저 입력해 주세요.\n프로그램 일지 탭의 "장소" 칸에 센터명을 적으면 센터별로 저장됩니다.'); show('journal'); const jp=document.getElementById('j-place'); if(jp) jp.focus(); return; }
  rec.id='J'+rec.year+rec.month.padStart(2,'0')+rec.day.padStart(2,'0')+'_'+rec.center+'_'+rec.teacher;  // 같은 센터·강사·날짜면 덮어쓰기
  const base=`${rec.year}${rec.month.padStart(2,'0')}${rec.day.padStart(2,'0')}_프로그램일지`;  // 파일명 접두어
  // 1) 즉시 로컬 누적(오프라인에서도 보존)
  const list=_loadJournals(); const li=list.findIndex(x=>x.id===rec.id);
  if(li>=0) list[li]={...rec,savedAt:Date.now()}; else list.push({...rec,savedAt:Date.now()});
  _saveJournalsLocal(list);
  // 2) PDF·WORD 만들어 드라이브(강사→센터→연도)에 저장 + 시트 기록
  _toast('⏳ 파일 만드는 중…', 0);

  let files=null;
  try{ files=await _buildJournalFiles(); }catch(e){ files=null; }
  if(wasCur!=='journal') show(wasCur);
  _toast('⏳ 드라이브 저장 중…', 0);
  const payload={ action:'saveJournalRecord', data:{...rec, files: files?{ pdf:{name:base+'.pdf',mime:'application/pdf',data:files.pdf}, doc:{name:base+'.doc',mime:'application/msword',data:files.doc} }:null } };
  Promise.resolve(_gasPostPlan(payload)).then(res=>{
    if(res&&res.ok){
      _toast('✅ 드라이브에 저장됐어요');
      if(res.folderUrl||res.pdfUrl){ const l2=_loadJournals(); const k=l2.findIndex(x=>x.id===rec.id); if(k>=0){ l2[k].folderUrl=res.folderUrl||''; l2[k].pdfUrl=res.pdfUrl||''; l2[k].docUrl=res.docUrl||''; _saveJournalsLocal(l2); } }
    } else { _toast('📥 기기에 저장됐어요 (드라이브 동기화 대기)'); }
  }).catch(()=>{ _toast('📥 기기에 저장됐어요 (드라이브 동기화 대기)'); });
}

function _mergeRecords(server){
  const map={}; (server||[]).forEach(r=>{ if(r&&r.id) map[r.id]=r; });
  _loadJournals().forEach(r=>{ if(r&&r.id && !map[r.id]) map[r.id]=r; });  // 서버에 없는 로컬(미동기화)만 보강

function _uniqSorted(vals,{num}={}){ const s=[...new Set(vals.filter(v=>v!==''&&v!=null).map(String))]; s.sort((a,b)=> num?(Number(b)-Number(a)):a.localeCompare(b,'ko')); return s; }

  const list=EVAL.map((t,i)=>`<div class="ev${i===wzEvalIdx?' sel':''}" onclick="pickEval(${i})"><span class="n">${i+1}.</span>${esc(t)}</div>`).join('');
  const cust=`<div class="ev${wzEvalIdx==='c'?' sel':''}" onclick="pickEval('c')"><span class="n">✏️</span>직접 입력</div>`+
    `<textarea id="wz-eval-custom" class="ev-ta" placeholder="평가를 직접 작성하세요" oninput="wzEvalCustom=this.value" style="display:${wzEvalIdx==='c'?'block':'none'}">${esc(wzEvalCustom)}</textarea>`;
  document.getElementById('wz-evs').innerHTML=list+cust;
  if(wzEvalIdx==='c'){ const ta=document.getElementById('wz-eval-custom'); if(ta){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);} }
}
function pickEval(i){ if(i==='c'){ wzEvalIdx='c'; } else { wzEvalIdx=(wzEvalIdx===i?-1:i); } renderEvals(); }
function wzPhoneSync(){ const nm=wzTeacherName(); if(PHONE[nm]) document.getElementById('wz-phone').value=PHONE[nm]; }
function openWizard(){
  wzEvalIdx=-1; wzEvalCustom='';
  fillTeacherSelect(document.getElementById('wz-teacher'));
  document.getElementById('wz-teacher').value='박기남';
  document.getElementById('wz-teacherEtc').hidden=true; document.getElementById('wz-teacherEtc').value='';
  document.getElementById('wz-phone').value=PHONE['박기남']||'';
  const d=new Date(); document.getElementById('wz-date').value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  document.getElementById('wz-place').value=''; document.getElementById('wz-people').value='';
  document.getElementById('wz-mgr').value=gMgr.region||'서울';
  wzMain.value='0'; wzResetSubs(); renderEvals();
  // 팝업이 깔끔하게 보이도록 뒤 선택화면 숨김
  const ss=document.getElementById('selectScreen'); if(ss) ss.style.display='none';
  document.getElementById('wzOv').classList.add('on');
}
// ── 진입 시 작업 선택 팝업(작성 / 불러오기) ──
let _hubReturn=false;
function openMenu(){
  const ss=document.getElementById('selectScreen'); if(ss) ss.style.display='none';
  document.getElementById('wzOv').classList.remove('on');
  document.getElementById('ldOv').classList.remove('on');
  document.getElementById('menuOv').classList.add('on');
}
function _closePlanWindow(){
  try{ if(window.parent && window.parent!==window && typeof window.parent._closePlan==='function'){ window.parent._closePlan(); return true; } }catch(e){}
  const ss=document.getElementById('selectScreen'); if(ss) ss.style.display='';   // 단독 실행 폴백
  return false;
}
function closeMenu(){
  document.getElementById('menuOv').classList.remove('on');
  if(document.getElementById('planScreen').style.display==='block') return;  // 이미 작성/불러온 상태면 그대로
  _closePlanWindow();  // 메뉴를 닫으면 계획서 창 자체를 닫아 홈으로
}
function menuGoWrite(){ _hubReturn=true; document.getElementById('menuOv').classList.remove('on'); openWizard(); }
function menuGoLoad(){ _hubReturn=true; document.getElementById('menuOv').classList.remove('on'); openLoad(); }
// ── 상단 바: 편집 패널 토글 · 저장 메뉴 · 토스트 ──
function toggleEdit(){ const b=document.getElementById('editBar'), t=document.getElementById('editToggle'); const show=b.hidden; b.hidden=!show; t.classList.toggle('on',show); }
function toggleSaveMenu(e){ if(e)e.stopPropagation(); const m=document.getElementById('saveMenu'); m.hidden=!m.hidden; }
function closeSaveMenu(){ const m=document.getElementById('saveMenu'); if(m) m.hidden=true; }
document.addEventListener('click',(e)=>{ const w=e.target.closest('.menu-wrap'); if(!w) closeSaveMenu(); });
let _toastT=null;
function _toast(msg,ms){ const el=document.getElementById('toast'); if(!el) return; el.textContent=msg; el.classList.add('on'); if(_toastT) clearTimeout(_toastT); if(ms!==0) _toastT=setTimeout(()=>el.classList.remove('on'), ms||2200); }
function _toastHide(){ const el=document.getElementById('toast'); if(el) el.classList.remove('on'); }
function closeWizard(){
  document.getElementById('wzOv').classList.remove('on');
  if(document.getElementById('planScreen').style.display==='block') return;  // 이미 작성 화면이면 그대로
  if(_hubReturn){ _hubReturn=false; openMenu(); return; }                    // 메뉴에서 왔으면 메뉴로 복귀
  _closePlanWindow();
}
function dateKText(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; }
let PENDING=null;
function submitWizard(){
  PENDING={ teacher:wzTeacherName(), phone:(document.getElementById('wz-phone').value||'').trim(), date:document.getElementById('wz-date').value,
    place:(document.getElementById('wz-place').value||'').trim(), people:(document.getElementById('wz-people').value||'').trim(),
    main:wzMain.value, sub1:wzSub1.value, sub2:wzSub2.value, evalText:(wzEvalIdx==='c'?wzEvalCustom.trim():(wzEvalIdx>=0?EVAL[wzEvalIdx]:'')), mgr:document.getElementById('wz-mgr').value };
  // 스캔 라인이 질문지를 훑으며 '작성 완료' 문서로 바뀜
  const ov=document.getElementById('wzOv'), card=ov.querySelector('.wz');
  card.scrollTop=0;
  card.classList.remove('scanning'); void card.offsetWidth; card.classList.add('scanning');
  setTimeout(()=>{
    ov.classList.remove('on'); card.classList.remove('scanning');
    finishWizard();
  },1450);
}
function finishWizard(){
  const P=PENDING; if(!P) return;
  gPhone=P.phone||PHONE[P.teacher]||'';
  gMgr=mgrOf(P.mgr);
  setTeacherName(P.teacher);
  document.getElementById('startMain').value=P.main;
  if(P.date) document.getElementById('startDate').value=P.date;
  document.getElementById('selectScreen').style.display='none';
  document.getElementById('planScreen').style.display='block';
  CUR='intro'; buildAll();
  document.getElementById('sub1sel').value=P.sub1; document.getElementById('sub2sel').value=P.sub2;
  const jt=document.getElementById('j-teacher'); if(jt) jt.value=P.teacher?`${P.teacher} 강사`:'';
  const jd=document.getElementById('j-date'); if(jd) jd.value=dateKText(P.date);
  const jp=document.getElementById('j-place'); if(jp) jp.value=P.place;
  const jpe=document.getElementById('j-people'); if(jpe) jpe.value=P.people;
  updateJournalAuto();
  const je=document.getElementById('j-eval'); if(je && P.evalText) je.value=P.evalText;
  _hubReturn=false;
  show('intro');
}
// 강사 드롭다운 초기화(편집 패널)
try{ fillTeacherSelect(document.getElementById('teacherSel')); setTeacherName('박기남'); }catch(e){}
// 계획서 진입 시 작업 선택 팝업(작성 / 불러오기)
try{ openMenu(); }catch(e){}
</script></body></html>
